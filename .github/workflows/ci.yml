name: Flutter CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        run: cd app_inmobiliaria && flutter pub get
      - name: Linter Check
        run: cd app_inmobiliaria && flutter analyze
      - name: Run Tests
        run: cd app_inmobiliaria && flutter test
